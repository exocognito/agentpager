name: AgentPager
options:
  bundleIdPrefix: me.agentpager
  # The Xcode whose recommended settings this project has taken (LastUpgradeCheck 2720), so Xcode doesn't offer
  # "Update to recommended settings". Raise it with the next Xcode after taking what that one recommends.
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# The phone's side of the encrypted-part format and of alerts (packages/contract), as a local Swift package that
# `swift test` also runs on its own (pnpm test). The app opens what it reads and seals its answers with it; the alert
# extension opens previews; the UI tests' agent seals and opens as the agentpager command does.
packages:
  AgentPagerCrypto:
    path: AgentPagerCrypto
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode 27.2's recommended project settings.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # No App Intents here: skip their metadata step, which otherwise logs "Metadata extraction skipped" per target.
    LM_SKIP_METADATA_EXTRACTION: YES
    # Sam's paid Apple Developer team (alerts need it, D7); kept here so xcodegen does not drop it.
    DEVELOPMENT_TEAM: X3M532E87A
    # The server this build uses. Change it here, in the Settings app (AgentPager → Server, for self-hosters), or with
    # the launch argument -AgentPagerServerURL http://host:8787
    AGENTPAGER_SERVER_URL: "https://agentpager.me"
targets:
  AgentPager:
    type: application
    platform: iOS
    sources:
      - path: AgentPager
    # Alerts (C17): Apple's push service, time-sensitive alerts, and a wake in the background to refresh the badge.
    # Xcode's automatic signing registers these for the app id the first time the owner builds.
    # The keychain group is the app's own App ID, where every pager made so far already is (Model/Keychain.swift). Its
    # first entry is where new pagers go, so it stays first. A development profile allows any TEAMID.* group.
    entitlements:
      path: AgentPager/AgentPager.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)me.agentpager.app.dev
    dependencies:
      - target: AgentPagerNotifications
      - package: AgentPagerCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev
        PRODUCT_NAME: AgentPager
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: AgentPager/Info.plist
      properties:
        CFBundleDisplayName: AgentPager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: AgentPager connects to your AgentPager server on this network.
        UIBackgroundModes:
          - remote-notification
        AgentPagerServerURL: $(AGENTPAGER_SERVER_URL)
  # The alert extension (Notification Service Extension), embedded in the app. It reads pagers' keys from the app's
  # keychain group and never touches the network. A new bundle id, so the owner's first build in Xcode with automatic
  # signing registers its App ID and makes its development profile; the keychain group is in every such profile
  # (TEAMID.*). No time-sensitive entitlement: Apple allows it only on apps, and the app's own covers its alerts.
  AgentPagerNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentPagerNotifications
      - path: AgentPager/Model/Keychain.swift
    dependencies:
      - package: AgentPagerCrypto
    entitlements:
      path: AgentPagerNotifications/AgentPagerNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)me.agentpager.app.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev.notifications
        PRODUCT_NAME: AgentPagerNotifications
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AgentPagerNotifications/Info.plist
      properties:
        CFBundleDisplayName: AgentPager Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # Unit tests, run inside the app in the Simulator, so the Keychain they use is the app's own: the alert extension's
  # code (compiled in here too) against pagers saved as the app saves them. They skip on a phone, where the app's
  # Keychain holds real pagers.
  AgentPagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgentPagerTests
      - path: AgentPager/Model/Keychain.swift
      - path: AgentPagerNotifications/NotificationService.swift
    dependencies:
      - target: AgentPager
      - package: AgentPagerCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  AgentPagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgentPagerUITests
    dependencies:
      - target: AgentPager
      # Its agent seals cards and opens answers as the agentpager command does.
      - package: AgentPagerCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentPager
schemes:
  AgentPager:
    build:
      targets:
        AgentPager: all
        AgentPagerTests: [test]
        AgentPagerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentPagerTests
        - AgentPagerUITests
