name: AgentPager
options:
  bundleIdPrefix: me.agentpager
  # The Xcode whose recommended settings this project has taken (LastUpgradeCheck 2720), so Xcode doesn't offer
  # "Update to recommended settings". Raise it with the next Xcode after taking what that one recommends.
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode 27.2's recommended project settings.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Sam's paid Apple Developer team (alerts need it, D7); kept here so xcodegen does not drop it.
    DEVELOPMENT_TEAM: X3M532E87A
    # The server this build uses. Change it here, in the Settings app (AgentPager → Server, for self-hosters), or with
    # the launch argument -AgentPagerServerURL http://host:8787
    AGENTPAGER_SERVER_URL: "https://agentpager.me"
targets:
  AgentPager:
    type: application
    platform: iOS
    sources:
      - path: AgentPager
    # Alerts (C17): Apple's push service, time-sensitive alerts, and a wake in the background to refresh the badge.
    # Xcode's automatic signing registers these for the app id the first time the owner builds.
    entitlements:
      path: AgentPager/AgentPager.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev
        PRODUCT_NAME: AgentPager
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: AgentPager/Info.plist
      properties:
        CFBundleDisplayName: AgentPager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: AgentPager connects to your AgentPager server on this network.
        UIBackgroundModes:
          - remote-notification
        AgentPagerServerURL: $(AGENTPAGER_SERVER_URL)
  AgentPagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgentPagerUITests
    dependencies:
      - target: AgentPager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.agentpager.app.dev.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentPager
schemes:
  AgentPager:
    build:
      targets:
        AgentPager: all
        AgentPagerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentPagerUITests
